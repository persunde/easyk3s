site_name: EasyK3S
site_url: https://easyk3s.dev
site_description: A hands-on guide to setting up your first K3S cluster - from a clean VM to a production-ready setup with HTTPS, monitoring, logging and storage.
site_author: Per Sunde

repo_name: easyk3s
repo_url: https://github.com/persunde/easyk3s

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Prerequisites: getting-started/prerequisites.md
    - Install K3S: getting-started/install.md
    - Initial Setup: getting-started/initial-setup.md
  - First Steps:
    - Hello World: first-steps/first-deployment.md
    - Expose with Ingress: first-steps/expose-ingress.md
  - Networking:
    - Traefik Ingress: networking/traefik.md
    - HTTPS & Let's Encrypt: networking/https-letsencrypt.md
  - Security:
    - Authentication: security/auth.md
  - Storage:
    - Longhorn: storage/longhorn.md
  - Observability:
    - Metrics: observability/metrics.md
    - Logging: observability/logging.md
  - Reliability:
    - Auto Healing: reliability/auto-healing.md
  - Databases:
    - PostgreSQL: databases/postgres.md
  - FAQ: faq.md
